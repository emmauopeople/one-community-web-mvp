# LOCAL FOUNDATION ONLY. No tunnel, Swarm init, OVH or production deployment.
name: onecommunity_mvp
services:
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Run npm run setup:local}
      POSTGRES_USER: ${POSTGRES_USER:?Run npm run setup:local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup:local}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [internal]
  migrate:
    build: { context: ., dockerfile: infra/Dockerfile.tools }
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    command: [node, scripts/migrate.mjs]
    depends_on: { postgres: { condition: service_healthy } }
    networks: [internal]
  seed:
    build: { context: ., dockerfile: infra/Dockerfile.tools }
    profiles: [tools]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      LOCAL_DEVELOPMENT: ${LOCAL_DEVELOPMENT:-false}
      LOCAL_ADMIN_EMAIL: ${LOCAL_ADMIN_EMAIL}
      LOCAL_ADMIN_PASSWORD: ${LOCAL_ADMIN_PASSWORD}
      LOCAL_PROVIDER_PASSWORD: ${LOCAL_PROVIDER_PASSWORD}
    command: [node, scripts/seed-local.mjs]
    depends_on: { migrate: { condition: service_completed_successfully } }
    networks: [internal]
  mailpit:
    image: axllent/mailpit:v1.27@sha256:e22dce5b36f93c77082e204a3942fb6b283b7896e057458400a4c88344c3df68
    ports: ['127.0.0.1:8025:8025']
    networks: [internal]
  skill-api:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
      args: { APP_DIR: services/skill-visibility }
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SESSION_SECRET: ${SESSION_SECRET:?Run npm run setup:local}
      OTP_SECRET: ${OTP_SECRET:?Run npm run setup:local}
      COOKIE_SECURE: 'false'
      ALLOWED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_FROM: no-reply@example.test
      LOCAL_DEVELOPMENT: 'true'
    depends_on: { migrate: { condition: service_completed_successfully } }
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://localhost:3000/health/db").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]
  admin-api:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
      args: { APP_DIR: apps/admin-api }
    command: [node, src/server.js]
    environment:
      NODE_ENV: development
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      SESSION_SECRET: ${ADMIN_SESSION_SECRET:?Run npm run setup:local}
      ADMIN_FRONTEND_URL: http://localhost:8081
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_FROM: no-reply@example.test
      LOCAL_DEVELOPMENT: 'true'
    depends_on: { migrate: { condition: service_completed_successfully } }
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://localhost:5000/api/admin/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]
  public-web:
    build: { context: ., dockerfile: infra/Dockerfile.web, args: { APP_DIR: apps/public-web } }
    networks: [internal]
  admin-web:
    build: { context: ., dockerfile: infra/Dockerfile.web, args: { APP_DIR: apps/admin-web } }
    networks: [internal]
  traefik:
    image: traefik:v3.6@sha256:31267173a15b4944e797a76ffd9c419707c8d8b32fe5b610f80cd0cfa05f372d
    command:
      - --entrypoints.public.address=:80
      - --entrypoints.admin.address=:81
      - --entrypoints.mobile.address=:82
      - --providers.file.filename=/etc/traefik/routes.yaml
      - --api.dashboard=false
    ports: ['127.0.0.1:8080:80', '127.0.0.1:8081:81', '127.0.0.1:8082:82']
    volumes: [./infra/traefik/routes.yaml:/etc/traefik/routes.yaml:ro]
    depends_on:
      skill-api: { condition: service_healthy }
      admin-api: { condition: service_healthy }
      public-web: { condition: service_started }
      admin-web: { condition: service_started }
    networks: [internal]
networks:
  internal: {}
volumes:
  postgres-data: {}
