name: Foundation CI
on:
  push:
    branches: ['feature/**', release, main]
  pull_request:
    branches: [release, main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: compose.yaml:compose.ci-dns.yaml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - run: npm run check:secrets
      - run: npm run install:apps
      - run: npm test
      - run: npm run test:legacy
      - run: npm run build
      - run: npm run setup:local
      - name: Define isolated CI subnet for forced address replacement
        run: |
          printf 'networks:\n  internal:\n    ipam:\n      config:\n        - subnet: 172.28.210.0/24\n' > compose.ci-dns.yaml
      - run: docker compose config --quiet
      - run: docker compose up --build -d
      - run: docker compose run --build --rm seed
      - run: npm run test:smoke
      - name: Verify tunnel gateway without connecting to Cloudflare
        env:
          CLOUDFLARED_IMAGE: cloudflare/cloudflared:latest
        run: |
          printf 'ci-placeholder-not-a-tunnel-token' > .env.tunnel-token
          docker compose -f compose.yaml -f compose.tunnel.yaml -f compose.ci-dns.yaml config --quiet
          docker compose -f compose.yaml -f compose.tunnel.yaml -f compose.ci-dns.yaml up --build -d tunnel-gateway
          node scripts/tunnel-gateway-check.mjs
          node scripts/test-tunnel-dns.mjs
      - if: always()
        run: docker compose down --remove-orphans
