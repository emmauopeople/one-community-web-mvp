# Optional: use after compose.yaml and compose.tunnel.yaml.
services:
  admin-api:
    environment:
      ADMIN_FRONTEND_URL: https://admin.servicecam.org
  admin-tunnel-gateway:
    image: nginx:stable-alpine@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    volumes: [./infra/admin-tunnel-gateway.conf:/etc/nginx/conf.d/default.conf:ro]
    depends_on:
      admin-api: {condition: service_healthy}
      admin-web: {condition: service_started}
    networks: [internal, tunnel]
    restart: unless-stopped
