# Tunnel-only admin: the application requires an authenticated admin session.
limit_req_zone $binary_remote_addr zone=admin_auth:10m rate=10r/m;
resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 3s;
upstream admin_api_backend {
  zone admin_api_backend 64k;
  server admin-api:5000 resolve;
}
upstream admin_web_backend {
  zone admin_web_backend 64k;
  server admin-web:80 resolve;
}
server {
  listen 8080 default_server;
  server_name _;
  return 404;
}
server {
  listen 8080;
  server_name admin.servicecam.org;
  if ($http_x_forwarded_proto = "http") { return 308 https://admin.servicecam.org$request_uri; }
  access_log off;
  client_max_body_size 1m;
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header CF-Connecting-IP;
  add_header Cache-Control "no-store" always;
  location = /api/admin/health { return 404; }
  location /api/admin/auth/ {
    limit_req zone=admin_auth burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://admin_api_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
  }
  location /api/admin/ {
    proxy_pass http://admin_api_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
  }
  location /api/ { return 404; }
  location = /metrics { return 404; }
  location / {
    proxy_pass http://admin_web_backend;
    proxy_set_header Host $host;
  }
}
