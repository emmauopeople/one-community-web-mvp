# No published host port. Cloudflared is on the dedicated tunnel network.
server {
  listen 8080 default_server;
  server_name _;
  return 404;
}
server {
  listen 8080;
  server_name servicecam.org;
  if ($http_x_forwarded_proto = "http") { return 308 https://servicecam.org$request_uri; }
  client_max_body_size 10m;
  # Cloudflare sets CF-Connecting-IP; only private Docker peers can supply it here.
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header CF-Connecting-IP;
  access_log off;
  location ~* ^/api/(admin|metrics|health)(/|$) { return 404; }
  location /api/ {
    proxy_pass http://skill-api:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 120s;
    add_header Cache-Control "no-store" always;
  }
  location / {
    proxy_pass http://public-web:80;
    proxy_set_header Host $host;
  }
}
