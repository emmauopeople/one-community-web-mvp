# No published host port. Cloudflared is on the dedicated tunnel network.
# Docker can replace backend containers without restarting this gateway.
# Re-resolve their addresses rather than retaining the startup addresses.
resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 3s;
upstream skill_api_backend {
  zone skill_api_backend 64k;
  server skill-api:3000 resolve;
}
upstream public_web_backend {
  zone public_web_backend 64k;
  server public-web:80 resolve;
}
server {
  listen 8080 default_server;
  server_name _;
  return 404;
}
server {
  listen 8080;
  server_name servicecam.org;
  if ($http_x_forwarded_proto = "http") { return 308 https://servicecam.org$request_uri; }
  client_max_body_size 10m;
  # Cloudflare sets CF-Connecting-IP; only private Docker peers can supply it here.
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header CF-Connecting-IP;
  access_log off;
  location ~* ^/api/(admin|metrics|health)(/|$) { return 404; }
  location /api/ {
    proxy_pass http://skill_api_backend/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 120s;
    add_header Cache-Control "no-store" always;
  }
  location / {
    proxy_pass http://public_web_backend;
    proxy_set_header Host $host;
  }
}
